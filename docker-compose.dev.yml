version: '3.9'

services:
  # База данных PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: quiztime_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: quiztime
      POSTGRES_USER: quizuser
      POSTGRES_PASSWORD: quizpass123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizuser -d quiztime"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis (кэш и очереди)
  redis:
    image: redis:7-alpine
    container_name: quiztime_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
